<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Illustration générique d'une mobilisation lycéenne</title>
<desc id="desc">Illustration fictive montrant un lycée avec des flammes et de la fumée, une foule avec des mégaphones et des forces de l'ordre. Ce visuel n'est pas une photographie.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060910"/><stop offset=".58" stop-color="#121a2a"/><stop offset="1" stop-color="#26100d"/></linearGradient>
<linearGradient id="fire" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#ff3b20"/><stop offset=".55" stop-color="#ff9a2e"/><stop offset="1" stop-color="#ffe28a"/></linearGradient>
<linearGradient id="smoke" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#475163" stop-opacity=".55"/><stop offset="1" stop-color="#111827" stop-opacity=".05"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<circle cx="1010" cy="145" r="190" fill="#ff5f56" opacity=".08"/><circle cx="190" cy="120" r="190" fill="#5da8ff" opacity=".08"/>
<ellipse cx="600" cy="690" rx="590" ry="155" fill="#ff5f56" opacity=".11" filter="url(#blur)"/>
<!-- smoke -->
<path d="M530 280c-45-65 15-110 55-80 15-90 90-95 105-16 70-44 114 29 67 82-35 39-55 72-40 112H560c13-33 4-59-30-98z" fill="url(#smoke)"/>
<!-- school -->
<path d="M305 370h560v225H305z" fill="#222d42" stroke="#76839a" stroke-width="4"/>
<path d="M270 370l315-135 315 135z" fill="#35435d" stroke="#9aa8bf" stroke-width="4"/>
<text x="585" y="415" fill="#f5f7fb" font-family="Arial" font-size="34" font-weight="900" text-anchor="middle">LYCÉE</text>
<g fill="#87b8dd" opacity=".65">
<rect x="350" y="455" width="72" height="100" rx="4"/><rect x="455" y="455" width="72" height="100" rx="4"/>
<rect x="640" y="455" width="72" height="100" rx="4"/><rect x="745" y="455" width="72" height="100" rx="4"/>
</g><rect x="550" y="490" width="70" height="105" fill="#101724"/>
<!-- flames -->
<g fill="url(#fire)" stroke="#ffb13d" stroke-width="3">
<path d="M330 455c-25-61 28-72 14-130 68 58 55 109 36 130z"/>
<path d="M415 470c-22-69 35-91 16-150 81 70 61 115 36 150z"/>
<path d="M700 470c-22-69 35-91 16-150 81 70 61 115 36 150z"/>
<path d="M790 455c-25-61 28-72 14-130 68 58 55 109 36 130z"/>
</g>
<g fill="#fff4d6"><path d="M341 455c-11-32 11-42 8-73 34 31 25 53 13 73z"/><path d="M435 470c-12-38 14-52 8-87 39 35 26 62 12 87z"/><path d="M720 470c-12-38 14-52 8-87 39 35 26 62 12 87z"/></g>
<!-- crowd -->
<g fill="#0c1320" stroke="#7c899c" stroke-width="3">
<circle cx="125" cy="515" r="42"/><path d="M70 650q16-120 110 0z"/>
<circle cx="235" cy="485" r="37"/><path d="M185 635q15-105 100 0z"/>
<circle cx="950" cy="485" r="39"/><path d="M895 640q15-108 110 0z"/>
<circle cx="1065" cy="515" r="42"/><path d="M1010 650q16-120 110 0z"/>
</g>
<!-- megaphones -->
<path d="M150 430l120-55 74 35-120 55z" fill="#ffb84d"/><rect x="267" y="405" width="78" height="25" rx="8" fill="#f5f7fb" transform="rotate(18 306 417)"/>
<path d="M875 425l122-49 70 38-122 50z" fill="#5da8ff"/><rect x="972" y="399" width="76" height="24" rx="8" fill="#f5f7fb" transform="rotate(18 1010 411)"/>
<!-- police -->
<g fill="#172235" stroke="#6d7e9c" stroke-width="4">
<circle cx="505" cy="595" r="34"/><path d="M455 720q15-110 100 0z"/><path d="M455 600h100" stroke="#5da8ff" stroke-width="7"/>
<circle cx="695" cy="595" r="34"/><path d="M645 720q15-110 100 0z"/><path d="M645 600h100" stroke="#5da8ff" stroke-width="7"/>
</g>
<!-- foreground signs -->
<g font-family="Arial" font-weight="900" text-anchor="middle">
<rect x="65" y="310" width="190" height="68" rx="12" fill="#f5f7fb"/><text x="160" y="352" fill="#101724" font-size="22">MOBILISATION</text>
<rect x="930" y="300" width="205" height="68" rx="12" fill="#f5f7fb"/><text x="1032" y="342" fill="#101724" font-size="21">17 OCTOBRE</text>
</g>
<rect x="32" y="32" width="1136" height="696" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="2"/>
</svg>